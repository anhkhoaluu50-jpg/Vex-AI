services:
  - type: web
    name: vex-code-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: deepseek-flash
      - key: APP_SECRET
        generateValue: true
      - key: SYSTEM_PROMPT
        value: Bạn là Vex, trợ lý AI chuyên lập trình. Trả lời tiếng Việt tự nhiên, viết code tốt, sửa lỗi và giải thích rõ.
